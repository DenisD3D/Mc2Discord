name: "Publish 26.3"
run-name: Publish 26.3-${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version"
        required: true
        default: "0.0.0-dev"

jobs:
  build-26-3:
    uses: ./.github/workflows/build-26.3.yml
    with:
      version: ${{ inputs.version }}

  publish-forge-26-3:
    uses: ./.github/workflows/publish-forge-26.3.yml
    needs: build-26-3
    with:
      version: ${{ inputs.version }}
    secrets: inherit

  publish-fabric-26-3:
    uses: ./.github/workflows/publish-fabric-26.3.yml
    needs: publish-forge-26-3
    with:
      version: ${{ inputs.version }}
    secrets: inherit
  
  publish-neoforge-26-3:
    uses: ./.github/workflows/publish-neoforge-26.3.yml
    needs: publish-fabric-26-3
    with:
      version: ${{ inputs.version }}
    secrets: inherit
